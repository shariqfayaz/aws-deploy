spring:
  application:
    name: STOCKSERVICE
  datasource:
    url: jdbc:mysql://localhost:3306/order_service
    username: root
    password: Re$et@pswd1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      show-sql: true
      properties:
        hibernate:
          # Format the SQL queries in logs
          format_sql: true
          # Cache configuration
          cache:
            use_second_level_cache: false
          # Connection pool settings
          connection:
            pool_size: 10
          # Batch processing settings
          jdbc:
            batch_size: 25
            fetch_size: 50
          # Statement logging
          generate_statistics: false
          # Session management
          current_session_context_class: thread
      hibernate:
        # Schema handling
        ddl-auto: update
      # Database dialect
      database-platform: org.hibernate.dialect.MySQL8Dialect
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka